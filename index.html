<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive US Map Hero Banner — Demo</title>
    <meta name="description" content="Responsive hero banner with a clickable US states map that links each state to a job search." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231B397E'/%3E%3Cpath d='M8 10h16v12H8z' fill='%23EAB828'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__circle" aria-hidden="true"></div>

      <header class="nav">
        <a class="nav__brand" href="#">JobMap</a>
        <button class="nav__toggle" aria-expanded="false" aria-controls="nav-links" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>
        <nav id="nav-links" class="nav__links">
          <a href="#">Compact Map</a>
          <a href="#">Compact Jobs</a>
          <a href="#">FAQs</a>
          <a href="#">Resources</a>
          <a href="#">Blog</a>
          <a href="#" class="btn btn--primary btn--sm">Post Jobs</a>
        </nav>
      </header>

      <div class="hero__body">
        <div class="hero__copy">
          <h1 id="hero-title">Coverage Across <span>the Nation</span></h1>
          <p>Pick a state on the map to see open positions there instantly. Highlighted states are part of the compact, so one license covers them all.</p>
          <div class="hero__actions">
            <a href="/jobs" class="btn btn--primary">Browse All Jobs</a>
            <a href="#" class="btn btn--ghost">Learn More</a>
            <a href="#" class="btn btn--ghost">Contact Us</a>
          </div>

          <label class="state-picker">
            <span>Or choose a state</span>
            <select id="state-select" aria-label="Choose a state to search jobs">
              <option value="">Select a state…</option>
            </select>
          </label>
        </div>

        <figure class="hero__map">
          <svg id="us-map" role="group" aria-label="Map of the United States. Select a state to search jobs."></svg>
          <div class="tooltip" id="tooltip" role="status" aria-live="polite" hidden></div>
          <figcaption class="legend">
            <span class="legend__swatch legend__swatch--hl"></span> Compact state
            <span class="legend__swatch"></span> Other states
          </figcaption>
        </figure>
      </div>
    </section>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
